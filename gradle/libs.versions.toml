[libraries]
anvillib-network = { group = "dev.anvilcraft.lib", name = "anvillib-network-neoforge-1.21.1", version.ref = "anvillib" }
jsr305 = { group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }
jeiApi = { group = "mezz.jei", name = "jei-1.21.1-neoforge-api", version.ref = "jei" }
jei = { group = "mezz.jei", name = "jei-1.21.1-neoforge", version.ref = "jei" }
delight = { group = "maven.modrinth", name = "farmers-delight", version = "1.21.1-1.2.11" }
delight-ends = { group = "maven.modrinth", name = "ends-delight", version = "2.5.1+neoforge.1.21.1" }
delight-oceans = { group = "maven.modrinth", name = "oceans-delight", version = "1.0.4" }
delight-crate = { group = "maven.modrinth", name = "crate-delight", version = "25.09.22-1.21-neoforge" }
create = { group = "maven.modrinth", name = "create", version = "mc1.21.1-6.0.9" }
